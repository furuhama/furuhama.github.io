<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Phase Commit 可視化</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --surface2: #eaeef2;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #636c76;
      --green: #1a7f37;
      --blue: #0969da;
      --purple: #8250df;
      --orange: #bc4c00;
      --red: #cf222e;
      --yellow: #9a6700;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text); }

    .badge {
      background: rgba(26,127,55,0.1); color: var(--green);
      border: 1px solid rgba(26,127,55,0.3);
      font-size: 0.7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 12px;
    }

    .back-link {
      font-size: 0.75rem; color: var(--text-muted);
      text-decoration: none; margin-left: auto;
      display: flex; align-items: center; gap: 4px;
    }
    .back-link:hover { color: var(--text); }

    .tab-bar {
      display: flex; background: var(--surface);
      border-bottom: 1px solid var(--border); padding: 0 24px;
    }
    .tab-btn {
      padding: 10px 18px; font-size: 0.82rem; font-weight: 500;
      color: var(--text-muted); background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer;
      transition: all 0.15s; margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
    .tab-btn:hover:not(.active) { color: var(--text); }

    .main { display: flex; flex: 1; }

    .svg-panel {
      flex: 1; padding: 20px 24px 16px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }

    #mainSvg {
      width: 100%; max-width: 700px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface);
    }

    .svg-note { font-size: 0.72rem; color: var(--text-muted); align-self: flex-start; max-width: 700px; width: 100%; }

    .info-panel {
      width: 300px; min-width: 260px;
      border-left: 1px solid var(--border); background: var(--surface);
      display: flex; flex-direction: column;
    }

    .info-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }

    .info-title {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px;
    }

    .scenario-desc { font-size: 0.8rem; color: var(--text); line-height: 1.65; }
    .scenario-desc code {
      background: var(--surface2); padding: 1px 5px; border-radius: 4px;
      font-family: 'Fira Code', monospace; font-size: 0.76rem;
    }

    .step-explain { font-size: 0.8rem; color: var(--text); line-height: 1.75; min-height: 80px; transition: opacity 0.2s; }
    .step-explain .hl-blue   { color: var(--blue);   font-weight: 700; }
    .step-explain .hl-green  { color: var(--green);  font-weight: 700; }
    .step-explain .hl-red    { color: var(--red);    font-weight: 700; }
    .step-explain .hl-purple { color: var(--purple); font-weight: 700; }
    .step-explain .hl-orange { color: var(--orange); font-weight: 700; }

    .legend { padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border); }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-muted); }
    .legend-box { width: 22px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .legend-line { width: 22px; height: 2px; flex-shrink: 0; }

    .controls { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .controls-row { display: flex; gap: 8px; }

    .btn {
      padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.8rem;
      cursor: pointer; transition: all 0.15s; font-weight: 500; flex: 1; text-align: center;
    }
    .btn:hover { background: var(--surface2); }
    .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
    .btn.primary:hover { background: #0550ae; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .step-counter { font-size: 0.72rem; color: var(--text-muted); text-align: center; }
    .step-dots { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
    .step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
    .step-dot.done    { background: var(--green); }
    .step-dot.current { background: var(--blue); }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <rect x="2" y="4" width="8" height="6" rx="2" stroke="#0969da" stroke-width="1.8"/>
    <rect x="8" y="14" width="8" height="6" rx="2" stroke="#1a7f37" stroke-width="1.8"/>
    <rect x="14" y="4" width="8" height="6" rx="2" stroke="#1a7f37" stroke-width="1.8"/>
    <line x1="6" y1="10" x2="12" y2="14" stroke="#636c76" stroke-width="1.4"/>
    <line x1="18" y1="10" x2="16" y2="14" stroke="#636c76" stroke-width="1.4"/>
  </svg>
  <h1>Two-Phase Commit 可視化</h1>
  <span class="badge">Interactive</span>
  <a class="back-link" href="index.html">
    <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
    </svg>
    一覧へ戻る
  </a>
</header>

<div class="tab-bar" id="tabBar"></div>

<div class="main">
  <div class="svg-panel">
    <svg id="mainSvg" viewBox="0 0 700 355" preserveAspectRatio="xMidYMid meet"></svg>
    <p class="svg-note">1 つのコーディネーターと 2 つの参加者ノード（DB A, DB B）による 2PC プロトコルを示しています。</p>
  </div>

  <div class="info-panel">
    <div class="info-section">
      <div class="info-title">シナリオ</div>
      <div class="scenario-desc" id="scenarioDesc"></div>
    </div>
    <div class="info-section">
      <div class="info-title">ステップ説明</div>
      <div class="step-explain" id="stepExplain"></div>
    </div>

    <div class="legend">
      <div class="info-title">凡例 — メッセージ</div>
      <div class="legend-item">
        <div class="legend-line" style="background:#0969da;"></div>
        PREPARE（準備要求）
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#1a7f37;"></div>
        YES / COMMIT / ACK
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#cf222e;"></div>
        NO / ABORT
      </div>
    </div>

    <div class="controls">
      <div class="controls-row">
        <button class="btn" id="btnPrev" onclick="prevStep()">◀ 前へ</button>
        <button class="btn primary" id="btnNext" onclick="nextStep()">次へ ▶</button>
      </div>
      <div class="controls-row">
        <button class="btn" id="btnAuto" onclick="toggleAuto()">▶ 自動再生</button>
        <button class="btn" onclick="resetScenario()">↺ リセット</button>
      </div>
      <div class="step-counter" id="stepCounter">ステップ: 1 / 1</div>
      <div class="step-dots" id="stepDots"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// SVG helpers
// ============================================================
const svgNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, text) {
  const e = document.createElementNS(svgNS, tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, String(v)));
  if (text != null) e.textContent = text;
  return e;
}

// ============================================================
// Layout constants
// ============================================================
const CX = 115;   // Coordinator center x
const AX = 360;   // DB Node A center x
const BX = 590;   // DB Node B center x
const BW  = 130;  // Header box width
const BH  = 52;   // Header box height (name + state)
const LL_TOP = BH + 10;   // Lifeline top y
const LL_BOT = 348;       // Lifeline bottom y

const NODE_X = { coord: CX, partA: AX, partB: BX };

// ============================================================
// Color maps
// ============================================================
const NCOLORS = {
  default:   { fill: '#f6f8fa',                stroke: '#d0d7de',  text: '#1f2328', sw: 1.8, dash: null },
  active:    { fill: 'rgba(9,105,218,0.09)',   stroke: '#0969da',  text: '#0550ae', sw: 2,   dash: null },
  waiting:   { fill: 'rgba(154,103,0,0.09)',   stroke: '#9a6700',  text: '#7d5700', sw: 2,   dash: null },
  deciding:  { fill: 'rgba(26,127,55,0.08)',   stroke: '#1a7f37',  text: '#1a7f37', sw: 2,   dash: null },
  voted_yes: { fill: 'rgba(26,127,55,0.09)',   stroke: '#1a7f37',  text: '#1a7f37', sw: 2,   dash: null },
  voted_no:  { fill: 'rgba(207,34,46,0.09)',   stroke: '#cf222e',  text: '#cf222e', sw: 2,   dash: null },
  committed: { fill: 'rgba(26,127,55,0.14)',   stroke: '#1a7f37',  text: '#1a7f37', sw: 2.5, dash: null },
  aborted:   { fill: 'rgba(207,34,46,0.1)',    stroke: '#cf222e',  text: '#cf222e', sw: 2.5, dash: null },
  crashed:   { fill: 'rgba(207,34,46,0.07)',   stroke: '#cf222e',  text: '#cf222e', sw: 2,   dash: '5,3' },
  blocking:  { fill: 'rgba(154,103,0,0.07)',   stroke: '#9a6700',  text: '#7d5700', sw: 2,   dash: '5,3' },
};

const MCOLORS = {
  request: '#0969da',
  yes:     '#1a7f37',
  no:      '#cf222e',
  commit:  '#1a7f37',
  abort:   '#cf222e',
  ack:     '#636c76',
};

// ============================================================
// Rendering
// ============================================================
function drawMsgArrow(parent, fromKey, toKey, y, label, type) {
  const fx = NODE_X[fromKey], tx = NODE_X[toKey];
  if (fx === tx) return;
  const color = MCOLORS[type] || MCOLORS.request;
  const dir = tx > fx ? 1 : -1;
  const AL = 9, AW = 4;
  const x2end = tx - dir * AL;

  parent.appendChild(svgEl('line', {
    x1: fx, y1: y, x2: x2end, y2: y,
    stroke: color, 'stroke-width': 1.7
  }));
  parent.appendChild(svgEl('polygon', {
    points: `${tx},${y} ${x2end},${y - AW} ${x2end},${y + AW}`,
    fill: color
  }));

  const midX = (fx + tx) / 2;
  parent.appendChild(svgEl('text', {
    x: midX, y: y - 5, 'text-anchor': 'middle',
    'font-size': 11, 'font-weight': 700,
    'font-family': 'Fira Code, Consolas, monospace',
    fill: color
  }, label));
}

function renderSnapshot(snap) {
  const svg = document.getElementById('mainSvg');
  svg.innerHTML = '';

  // ── Phase zone backgrounds ──────────────────────────────
  (snap.phases || []).forEach(({ y1, y2, fill, label }) => {
    svg.appendChild(svgEl('rect', { x: 0, y: y1, width: 700, height: y2 - y1, fill }));
    if (label) {
      svg.appendChild(svgEl('text', {
        x: 696, y: y1 + 13, 'text-anchor': 'end',
        'font-size': 10, fill: '#9ca3af',
        'font-family': '"Noto Sans", sans-serif'
      }, label));
    }
  });

  // ── Lifelines ──────────────────────────────────────────
  [CX, AX, BX].forEach(x => {
    svg.appendChild(svgEl('line', {
      x1: x, y1: LL_TOP, x2: x, y2: LL_BOT,
      stroke: '#d0d7de', 'stroke-width': 1, 'stroke-dasharray': '4,3'
    }));
  });

  // ── Messages ──────────────────────────────────────────
  // Drawn before nodes so nodes appear on top
  (snap.messages || []).forEach(m => {
    drawMsgArrow(svg, m.from, m.to, m.y, m.label, m.type);
  });

  // ── Blocking "???" indicators ─────────────────────────
  if (snap.blocking) {
    [AX, BX].forEach(x => {
      svg.appendChild(svgEl('line', {
        x1: x, y1: 230, x2: x, y2: 340,
        stroke: '#9a6700', 'stroke-width': 1.5, 'stroke-dasharray': '5,3'
      }));
      svg.appendChild(svgEl('text', {
        x, y: 290, 'text-anchor': 'middle',
        'font-size': 20, fill: 'rgba(154,103,0,0.4)',
        'font-family': '"Noto Sans", sans-serif'
      }, '?'));
      svg.appendChild(svgEl('text', {
        x, y: 320, 'text-anchor': 'middle',
        'font-size': 10, fill: '#9a6700',
        'font-family': '"Noto Sans", sans-serif'
      }, 'BLOCKING'));
    });
  }

  // ── Header boxes ──────────────────────────────────────
  const nodeDefs = [
    { key: 'coord', x: CX, name: 'Coordinator' },
    { key: 'partA', x: AX, name: 'DB Node A' },
    { key: 'partB', x: BX, name: 'DB Node B' },
  ];

  nodeDefs.forEach(({ key, x, name }) => {
    const ns = snap[key] || {};
    const c = NCOLORS[ns.state] || NCOLORS.default;
    const bx = x - BW / 2;

    const rAttrs = { x: bx, y: 6, width: BW, height: BH, rx: 8,
      fill: c.fill, stroke: c.stroke, 'stroke-width': c.sw };
    if (c.dash) rAttrs['stroke-dasharray'] = c.dash;
    svg.appendChild(svgEl('rect', rAttrs));

    // Node name
    svg.appendChild(svgEl('text', {
      x, y: 27, 'text-anchor': 'middle',
      'font-size': 12, 'font-weight': 700, fill: c.text,
      'font-family': '"Noto Sans", sans-serif'
    }, name));

    // State label
    if (ns.label) {
      svg.appendChild(svgEl('text', {
        x, y: 47, 'text-anchor': 'middle',
        'font-size': 10.5, 'font-weight': 600, fill: c.text,
        'font-family': 'Fira Code, Consolas, monospace'
      }, ns.label));
    }
  });

  // ── Crash marker ──────────────────────────────────────
  if (snap.coordCrashed) {
    const cy = 108;
    [[CX - 13, cy - 13, CX + 13, cy + 13],
     [CX + 13, cy - 13, CX - 13, cy + 13]].forEach(([x1, y1, x2, y2]) => {
      svg.appendChild(svgEl('line', {
        x1, y1, x2, y2,
        stroke: '#cf222e', 'stroke-width': 3.5, 'stroke-linecap': 'round'
      }));
    });
    svg.appendChild(svgEl('text', {
      x: CX, y: cy + 25, 'text-anchor': 'middle',
      'font-size': 10.5, fill: '#cf222e',
      'font-family': '"Noto Sans", sans-serif'
    }, '⚠ クラッシュ'));
  }
}

// ============================================================
// Phase zone presets
// ============================================================
const PH_NONE  = [];
const PH_P1    = [{ y1: 62, y2: 215, fill: 'rgba(9,105,218,0.035)', label: 'Phase 1: Prepare' }];
const PH_P1P2C = [
  { y1: 62, y2: 215, fill: 'rgba(9,105,218,0.035)', label: 'Phase 1: Prepare' },
  { y1: 215, y2: 355, fill: 'rgba(26,127,55,0.035)', label: 'Phase 2: Commit' },
];
const PH_P1P2A = [
  { y1: 62, y2: 215, fill: 'rgba(9,105,218,0.035)', label: 'Phase 1: Prepare' },
  { y1: 215, y2: 355, fill: 'rgba(207,34,46,0.03)', label: 'Phase 2: Abort' },
];
const PH_P1P2X = [
  { y1: 62, y2: 215, fill: 'rgba(9,105,218,0.035)', label: 'Phase 1: Prepare' },
  { y1: 215, y2: 355, fill: 'rgba(207,34,46,0.02)', label: 'Phase 2: ???' },
];

// ── Common message sets ────────────────────────────────────
const MSGS_PREPARE = [
  { from: 'coord', to: 'partA', label: 'PREPARE', y: 108, type: 'request' },
  { from: 'coord', to: 'partB', label: 'PREPARE', y: 126, type: 'request' },
];
const MSGS_YES_ALL = [
  ...MSGS_PREPARE,
  { from: 'partA', to: 'coord', label: 'YES', y: 168, type: 'yes' },
  { from: 'partB', to: 'coord', label: 'YES', y: 186, type: 'yes' },
];
const MSGS_COMMIT = [
  ...MSGS_YES_ALL,
  { from: 'coord', to: 'partA', label: 'COMMIT', y: 232, type: 'commit' },
  { from: 'coord', to: 'partB', label: 'COMMIT', y: 250, type: 'commit' },
];
const MSGS_COMMIT_ACK = [
  ...MSGS_COMMIT,
  { from: 'partA', to: 'coord', label: 'ACK', y: 295, type: 'ack' },
  { from: 'partB', to: 'coord', label: 'ACK', y: 313, type: 'ack' },
];

const MSGS_YES_NO = [
  ...MSGS_PREPARE,
  { from: 'partA', to: 'coord', label: 'YES', y: 168, type: 'yes' },
  { from: 'partB', to: 'coord', label: 'NO',  y: 186, type: 'no' },
];
const MSGS_ABORT = [
  ...MSGS_YES_NO,
  { from: 'coord', to: 'partA', label: 'ABORT', y: 232, type: 'abort' },
  { from: 'coord', to: 'partB', label: 'ABORT', y: 250, type: 'abort' },
];
const MSGS_ABORT_ACK = [
  ...MSGS_ABORT,
  { from: 'partA', to: 'coord', label: 'ACK', y: 295, type: 'ack' },
  { from: 'partB', to: 'coord', label: 'ACK', y: 313, type: 'ack' },
];

// ── Node state presets ─────────────────────────────────────
const N = (state, label) => ({ state, label });

// ============================================================
// Scenarios
// ============================================================
const SCENARIOS = [
  // ─────────────── ① 全員コミット ───────────────
  {
    name: "① 全員コミット",
    description: "全参加者が <code>YES</code> を返し、トランザクションが正常にコミットされる <strong>ハッピーパス</strong> です。",
    steps: [
      {
        coord: N('active',   'BEGIN'),
        partA: N('default',  'READY'),
        partB: N('default',  'READY'),
        phases: PH_NONE, messages: [],
        explain: "分散トランザクション開始。コーディネーターが 2 つの DB ノード（A, B）にまたがる更新を実行しようとしています。2PC でアトミックな完了を保証します。"
      },
      {
        coord: N('waiting',  'WAIT (votes)'),
        partA: N('active',   'Checking...'),
        partB: N('active',   'Checking...'),
        phases: PH_P1, messages: MSGS_PREPARE,
        explain: "<strong>Phase 1 開始。</strong><br>コーディネーターが全参加者に <code>PREPARE</code> を送信。各参加者はコミット可能かチェックし、<strong>WAL（Write-Ahead Log）</strong> に変更内容を書き込みます。"
      },
      {
        coord: N('deciding', 'DECIDING'),
        partA: N('voted_yes','Voted YES'),
        partB: N('voted_yes','Voted YES'),
        phases: PH_P1, messages: MSGS_YES_ALL,
        explain: "全参加者が <code>YES</code> を返しました。コーディネーターは<strong>コミット決定</strong>をログに書き込みます（この書き込みが完了すれば COMMIT は必ず実行される）。"
      },
      {
        coord: N('committed','COMMITTED'),
        partA: N('committed','COMMITTED'),
        partB: N('committed','COMMITTED'),
        phases: PH_P1P2C, messages: MSGS_COMMIT,
        explain: "<strong>Phase 2 開始。</strong><br>コーディネーターが全参加者に <code>COMMIT</code> を送信。各参加者はトランザクションを確定します。"
      },
      {
        coord: N('committed','COMMITTED ✓'),
        partA: N('committed','COMMITTED ✓'),
        partB: N('committed','COMMITTED ✓'),
        phases: PH_P1P2C, messages: MSGS_COMMIT_ACK,
        explain: "<span class='hl-green'>トランザクション完了！</span><br>全参加者が <code>ACK</code> を返しました。コーディネーターはトランザクションを閉じます。<br>全ノードが同じ状態（コミット済み）になりました。"
      },
    ]
  },

  // ─────────────── ② 参加者が拒否 ───────────────
  {
    name: "② 参加者が拒否",
    description: "参加者 DB B が <code>NO</code> を返し（例: 制約違反・ロック取得失敗）、<strong>トランザクション全体がアボート</strong>されるケースです。",
    steps: [
      {
        coord: N('active',  'BEGIN'),
        partA: N('default', 'READY'),
        partB: N('default', 'READY'),
        phases: PH_NONE, messages: [],
        explain: "分散トランザクション開始。今回は DB B でコミット不能な状態（例: 外部キー制約違反）が発生します。"
      },
      {
        coord: N('waiting', 'WAIT (votes)'),
        partA: N('active',  'Checking...'),
        partB: N('active',  'Checking...'),
        phases: PH_P1, messages: MSGS_PREPARE,
        explain: "<strong>Phase 1 開始。</strong><br>コーディネーターが <code>PREPARE</code> を送信。DB B はチェック中に制約違反を検出しました。"
      },
      {
        coord: N('waiting', 'Got NO → ABORT'),
        partA: N('voted_yes','Voted YES'),
        partB: N('voted_no', 'Voted NO'),
        phases: PH_P1, messages: MSGS_YES_NO,
        explain: "DB A は <code>YES</code>、DB B は <code>NO</code> を返しました。<br><strong>一人でも NO があれば全体アボート</strong>が 2PC のルールです。コーディネーターはアボート決定をログに書き込みます。"
      },
      {
        coord: N('aborted', 'ABORTED'),
        partA: N('aborted', 'ABORT...'),
        partB: N('aborted', 'ABORT...'),
        phases: PH_P1P2A, messages: MSGS_ABORT,
        explain: "<strong>Phase 2 開始。</strong><br>コーディネーターが全参加者に <code>ABORT</code> を送信。YES を返していた DB A も含め、<strong>全員がロールバック</strong>します。"
      },
      {
        coord: N('aborted', 'ABORTED ✗'),
        partA: N('aborted', 'ABORTED ✗'),
        partB: N('aborted', 'ABORTED ✗'),
        phases: PH_P1P2A, messages: MSGS_ABORT_ACK,
        explain: "<span class='hl-red'>トランザクション全体がアボート。</span><br>全参加者がロールバック後 <code>ACK</code> を返しました。DB B の問題が原因で、DB A の変更も取り消されました。"
      },
    ]
  },

  // ─────────────── ③ コーディネーター障害 ───────────────
  {
    name: "③ コーディネーター障害",
    description: "Phase 1 完了後、コーディネーターがクラッシュします。参加者は判断できず<strong>ブロッキング</strong>状態に陥ります。これが 2PC の本質的な限界です。",
    steps: [
      {
        coord: N('active',   'BEGIN'),
        partA: N('default',  'READY'),
        partB: N('default',  'READY'),
        phases: PH_NONE, messages: [],
        explain: "分散トランザクション開始。今回はコーディネーターが Phase 2 に移行する直前にクラッシュします。"
      },
      {
        coord: N('deciding', 'DECIDING'),
        partA: N('voted_yes','Voted YES'),
        partB: N('voted_yes','Voted YES'),
        phases: PH_P1, messages: MSGS_YES_ALL,
        explain: "Phase 1 完了。全参加者が <code>YES</code> を返し、コーディネーターがコミット決定をログに書き込もうとしています。"
      },
      {
        coord: N('crashed',  '--- DOWN ---'),
        partA: N('blocking', 'BLOCKING...'),
        partB: N('blocking', 'BLOCKING...'),
        phases: PH_P1P2X, messages: MSGS_YES_ALL,
        coordCrashed: true, blocking: true,
        explain: "<span class='hl-red'>コーディネーターがクラッシュ！</span><br>参加者はロック・リソースを保持したまま待機するしかありません。<strong>コミットすべきか？アボートすべきか？</strong> 単独では判断不可能です。"
      },
      {
        coord: N('crashed',  '--- DOWN ---'),
        partA: N('blocking', 'BLOCKING...'),
        partB: N('blocking', 'BLOCKING...'),
        phases: PH_P1P2X, messages: MSGS_YES_ALL,
        coordCrashed: true, blocking: true,
        explain: "<strong>ブロッキング問題（Blocking Problem）</strong><br>2PC は非ブロッキングではありません。解決策:<br>• <strong>3PC</strong> — タイムアウト + 追加フェーズで非ブロッキング化<br>• <strong>Paxos / Raft</strong> — 分散コンセンサスアルゴリズム<br>• <strong>Saga</strong> — 補償トランザクションによる結果整合性"
      },
    ]
  }
];

// ============================================================
// State & Controls
// ============================================================
let currentScenario = 0;
let currentStep = 0;
let autoTimer = null;

function renderStep() {
  const sc = SCENARIOS[currentScenario];
  const step = sc.steps[currentStep];
  renderSnapshot(step);

  const el = document.getElementById('stepExplain');
  el.style.opacity = 0;
  setTimeout(() => { el.innerHTML = step.explain || ''; el.style.opacity = 1; }, 100);

  document.getElementById('btnPrev').disabled = currentStep === 0;
  document.getElementById('btnNext').disabled = currentStep >= sc.steps.length - 1;
  updateStepCounter();
}

function nextStep() {
  const sc = SCENARIOS[currentScenario];
  if (currentStep < sc.steps.length - 1) { currentStep++; renderStep(); }
}

function prevStep() {
  if (currentStep > 0) { currentStep--; renderStep(); }
}

function resetScenario() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  currentStep = 0;
  document.getElementById('btnAuto').textContent = '▶ 自動再生';
  renderStep();
}

function toggleAuto() {
  if (autoTimer) {
    clearInterval(autoTimer); autoTimer = null;
    document.getElementById('btnAuto').textContent = '▶ 自動再生';
  } else {
    document.getElementById('btnAuto').textContent = '⏸ 停止';
    autoTimer = setInterval(() => {
      const sc = SCENARIOS[currentScenario];
      if (currentStep >= sc.steps.length - 1) {
        clearInterval(autoTimer); autoTimer = null;
        document.getElementById('btnAuto').textContent = '▶ 自動再生';
        return;
      }
      nextStep();
    }, 1600);
  }
}

function selectScenario(idx) {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  currentScenario = idx;
  currentStep = 0;
  document.getElementById('btnAuto').textContent = '▶ 自動再生';
  document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('scenarioDesc').innerHTML = SCENARIOS[idx].description;
  renderStep();
}

function updateStepCounter() {
  const sc = SCENARIOS[currentScenario];
  document.getElementById('stepCounter').textContent = `ステップ: ${currentStep + 1} / ${sc.steps.length}`;
  const dots = document.getElementById('stepDots');
  dots.innerHTML = '';
  sc.steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i < currentStep ? ' done' : i === currentStep ? ' current' : '');
    dots.appendChild(d);
  });
}

// ============================================================
// Init
// ============================================================
(function init() {
  const tabBar = document.getElementById('tabBar');
  SCENARIOS.forEach((sc, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = sc.name;
    btn.onclick = () => selectScenario(i);
    tabBar.appendChild(btn);
  });
  document.getElementById('scenarioDesc').innerHTML = SCENARIOS[0].description;
  renderStep();
})();
</script>
